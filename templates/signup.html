<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlagiarismGuard | Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="auth-container">
        <div class="auth-logo">
            <i class="fa-solid fa-user-shield"></i>
            <h1>New Account</h1>
            <p>Join the Secure Network</p>
        </div>

        <form action="/signup" method="POST">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="student@university.edu" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Create strong password" required>
                </div>
                <div class="strength-bar"><div id="strength-fill" class="strength-fill"></div></div>
            </div>

            <button type="submit" class="auth-btn">INITIALIZE ACCOUNT</button>
        </form>

        <div class="divider"><span>OR JOIN WITH</span></div>

        <a href="{{ url_for('google_login') }}" style="text-decoration: none;">
            <button class="google-btn"><i class="fa-brands fa-google"></i> Register with Google</button>
        </a>

        <div class="footer-links">
            Already have access? <a href="{{ url_for('login') }}">Login Here</a>
        </div>
    </div>

    <script>
        document.getElementById('password').addEventListener('input', function(e) {
            const val = e.target.value;
            const fill = document.getElementById('strength-fill');
            let strength = 0;
            if(val.length > 5) strength += 30;
            if(val.match(/[0-9]/)) strength += 30;
            if(val.match(/[^a-zA-Z0-9]/)) strength += 40;
            
            fill.style.width = strength + '%';
            if(strength < 40) fill.style.background = '#ef4444';
            else if(strength < 80) fill.style.background = '#f59e0b';
            else fill.style.background = '#10b981';
        });
    </script>
</body>
</html>
