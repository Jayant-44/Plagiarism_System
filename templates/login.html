<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlagiarismGuard | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="auth-container">
        <div class="auth-logo">
            <i class="fa-solid fa-shield-halved"></i>
            <h1>Welcome Back</h1>
            <p>Secure Access to PlagiarismGuard</p>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="student@university.edu" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="auth-btn">ACCESS DASHBOARD</button>
        </form>

        <div class="divider"><span>OR CONTINUE WITH</span></div>

        <a href="{{ url_for('google_login') }}" style="text-decoration: none;">
            <button class="google-btn">
                <i class="fa-brands fa-google"></i> Sign in with Google
            </button>
        </a>

        <div class="footer-links">
            Don't have an account? <a href="{{ url_for('signup') }}">Register Access</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
